spring.application.name=backend

# Port des eingebauten Webservers (8080 ist lokal schon von Apache belegt)
server.port=8081

# Zugangsdaten aus der Datei .env im Projektordner lesen (nur lokal, nie auf GitHub)
spring.config.import=optional:file:../.env[.properties]

# Verbindung zur MariaDB im Docker-Container (auf diesem Rechner über Port 3307)
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Die Tabellen legt database/schema.sql an: Hibernate prüft nur, ob sie zum Java-Code passen
spring.jpa.hibernate.ddl-auto=validate

# Datenbankverbindung nach jeder Anfrage sofort freigeben (empfohlen, entfernt die Warnung beim Start)
spring.jpa.open-in-view=false
